name: Oriel GPUI

# Plan 063's experiment: formats, lints and tests the Rust workspace, and checks that the
# TypeScript packages still produce the conformance vectors the Rust tests read. On demand, and
# on pull requests that touch the workspace or a package it ports.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/oriel-gpui/**
      - packages/media-domain/**
      - packages/media-format/**
      - packages/glazier-core/**
      - .github/workflows/oriel-gpui.yml

permissions:
  contents: read

jobs:
  check:
    # Apple silicon, as the fingerprint vectors were made with sharp's darwin-arm64 libvips.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install the pinned Rust toolchain
        working-directory: apps/oriel-gpui
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/oriel-gpui/target
          key: oriel-gpui-${{ runner.os }}-${{ hashFiles('apps/oriel-gpui/Cargo.lock', 'apps/oriel-gpui/rust-toolchain.toml') }}
          restore-keys: oriel-gpui-${{ runner.os }}-

      - name: Check the vectors from TypeScript
        run: |
          pnpm --filter @latch-works/media-domain test
          pnpm --filter @latch-works/glazier-core exec vitest run src/similarity/fingerprint-vectors.test.ts

      - name: Format, lint and test the Rust workspace
        run: pnpm oriel-gpui:check
