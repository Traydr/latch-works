name: Check

# Typechecks the TypeScript workspace, runs the shared packages' tests, which include the
# conformance vectors Oriel's Rust tests read, and checks the Rust formatting. The other formatting,
# lints, Knip and the app tests run on the owner's machine (`pnpm check:all`, `pnpm test`,
# `pnpm oriel:check`).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Test the shared packages and their conformance vectors
        run: pnpm -r --filter "./packages/**" test

  rust-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/oriel
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check the Rust formatting
        run: cargo fmt --check
