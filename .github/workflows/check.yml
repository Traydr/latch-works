name: Check

# A basic typecheck of the TypeScript workspace. Builds, formatting, lints, Knip and the tests run
# on the owner's machine (`pnpm check:all`, `pnpm test`), not here.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run Typecheck
        run: pnpm run typecheck
        env:
          LOCKSTEP_API_URL: ""
          LOCKSTEP_API_TOKEN: ""
