name: Check

# A basic typecheck of the TypeScript workspace, after building the shared packages it needs.
# Formatting, lints, Knip and the tests run on the owner's machine (`pnpm check:all`, `pnpm test`).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      # The shared packages export their types from dist/, so the apps that import them can only
      # be typechecked after the packages are built.
      - name: Build the shared packages
        run: pnpm -r --filter "./packages/**" run build

      - name: Run Typecheck
        run: pnpm run typecheck
        env:
          LOCKSTEP_API_URL: ""
          LOCKSTEP_API_TOKEN: ""
