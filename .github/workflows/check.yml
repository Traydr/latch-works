name: Check

# Typechecks the TypeScript workspace and runs the shared packages' tests, which include the
# conformance vectors Oriel's Rust tests read. Formatting, lints, Knip and the app tests run on the
# owner's machine (`pnpm check:all`, `pnpm test`).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Test the shared packages and their conformance vectors
        run: pnpm -r --filter "./packages/**" test
