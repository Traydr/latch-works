name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full workspace check
        run: pnpm check
        env:
          LOCKSTEP_API_URL: ""
          LOCKSTEP_API_TOKEN: ""
