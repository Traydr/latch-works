name: Oriel

# Lints the Rust workspace on Windows, so its `cfg(windows)` code is compiled, which the owner's
# `pnpm oriel:check` on macOS does not do. The Check workflow checks the formatting on every PR.
# Off by default: it runs only when started by hand (Actions › Oriel › Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/oriel
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/oriel/target
          key: oriel-${{ runner.os }}-${{ hashFiles('apps/oriel/Cargo.lock', 'apps/oriel/Cargo.toml', 'apps/oriel/rust-toolchain.toml') }}
          restore-keys: oriel-${{ runner.os }}-

      - name: Lint the Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
