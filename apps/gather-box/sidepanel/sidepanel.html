<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gather Box</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div class="layout-switcher" role="group" aria-label="Temporary layout switcher">
      <span class="switcher-label">LAYOUT</span>
      <button class="switch-btn" data-layout="1" type="button" aria-pressed="false">1</button>
      <button class="switch-btn" data-layout="2" type="button" aria-pressed="false">2</button>
      <button class="switch-btn" data-layout="3" type="button" aria-pressed="false">3</button>
      <button class="switch-btn" data-layout="4" type="button" aria-pressed="false">4</button>
      <button class="switch-btn" data-layout="5" type="button" aria-pressed="false">5</button>
      <span id="layoutName" class="switcher-name"></span>
    </div>

    <main id="layout-root" class="popup"></main>

    <script src="sidepanel.js"></script>
  </body>
</html>
