[package]
name = "oriel-migrate"
description = "The import of Electron Oriel's data into Oriel RS's own folder: read-only on Electron's side."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
oriel-core-paths.workspace = true
# Counting the Sync tokens the imported key opens, in `FileSecretStorage`'s format.
aes-gcm = "0.10"
base64 = "0.22"
# The Default profile made from Lockstep's old `lockstep.json`, as `ProfileService` makes it.
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Whether the process Electron's `SingletonLock` names is still running (`kill(pid, 0)`), and
# the host it names (`gethostname`).
libc = "0.2"

[dev-dependencies]
# The Undo test makes and undoes a real Tidy change on the catalog the import brought over.
oriel-core-tidy.workspace = true
futures.workspace = true

[lints]
workspace = true
