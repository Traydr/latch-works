[package]
name = "xtask"
description = "Oriel RS's developer commands: build the LGPL libmpv, vendor prebuilt libraries, make the app, measure it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The bundle fetches the pinned ffmpeg and ffprobe through the same code as fetch-media-tools.
oriel-tools.workspace = true
# The bundle checks that each library it packed loads from Contents/Frameworks.
libloading = "0.8"
# `measure` reads the app's memory and CPU time with proc_pid_rusage, as the View spike does.
libc = "0.2"

[lints]
workspace = true
