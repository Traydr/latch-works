[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# GPUI Kit pins its GPUI snapshot exactly, so this pin is exact too. Bump it on its own, with the
# GPUI tests and plan 063's Phase 0 measurements re-run.
gpui-kit = "=0.8.1"
gpui-fps = "=0.8.1"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The collation data ships inside this crate (icu_collator_data), so a bump can change the order
# of names. Bump it on its own, with the media-domain conformance vectors re-run.
icu_collator = "=2.4.0"

oriel-core-paths = { path = "crates/core-paths" }
oriel-core-domain = { path = "crates/core-domain" }
oriel-ui = { path = "crates/ui" }
oriel-media = { path = "crates/media" }
oriel-mode-view = { path = "crates/mode-view" }
oriel-mode-tidy = { path = "crates/mode-tidy" }
oriel-mode-sync = { path = "crates/mode-sync" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
