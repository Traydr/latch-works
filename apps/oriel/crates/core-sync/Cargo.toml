[package]
name = "oriel-core-sync"
description = "lockstep-core in Rust: the scan, the hash cache, plan, push, prune, the doctor and the Pane View client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
oriel-core-domain.workspace = true
oriel-core-index.workspace = true
oriel-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Pane View's API over HTTP and HTTPS: JSON bodies, streamed uploads, and the system's TLS
# (Security.framework on macOS), so no TLS library is built in.
reqwest = { workspace = true, features = ["json", "stream", "native-tls"] }
tokio = { workspace = true, features = ["rt", "fs", "io-util", "sync", "time"] }
# The client's request and response types come from lockstep-core's zod schemas, written out as
# JSON Schema (conformance/lockstep-core/api-schema.json) and built here at compile time.
typify = "0.8"

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile = "3"
# This crate's own fake Pane View, for its tests.
oriel-core-sync = { path = ".", features = ["test-support"] }
futures = { workspace = true, features = ["executor"] }

[features]
# `testing::FakePaneView`, a small Pane View on a local port for tests of Sync without the stack.
test-support = []

[lints]
workspace = true
