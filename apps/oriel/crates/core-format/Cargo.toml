[package]
name = "oriel-core-format"
description = "media-format's policies in Rust: which file becomes what in the archive, with which settings."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are modules of one binary, tests/main.rs.
autotests = false

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
