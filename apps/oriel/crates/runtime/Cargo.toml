[package]
name = "oriel-runtime"
description = "Background work without UI: cancel and pause tokens, a tokio thread, a SQLite thread per catalog, and file facts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are modules of one binary, tests/main.rs.
autotests = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
rusqlite.workspace = true
# The drivers are named here rather than left to reqwest's features: a future that sleeps or opens
# a socket on the runtime must find them whoever else is in the build.
tokio = { workspace = true, features = ["rt", "net", "time"] }

# The allocator calls behind `release_free_memory`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# A file's volume serial number and index (`fs_meta`), at the version already in the lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
reqwest.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
