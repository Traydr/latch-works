[package]
name = "oriel-core-domain"
description = "media-domain in Rust: natural order and sort orders, media kinds, archive paths, comics, the gallery's entries and system files."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are modules of one binary, tests/main.rs.
autotests = false

[dependencies]
icu_collator.workspace = true
icu_normalizer.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
