[package]
name = "oriel-mode-tidy"
description = "Tidy: Overview, Library, Duplicates, Clean up, Convert, Shrink, Holding, History."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The UI tests are modules of one binary, tests/main.rs.
autotests = false

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
oriel-ui.workspace = true
oriel-core-domain.workspace = true
oriel-core-paths.workspace = true
oriel-launch.workspace = true
oriel-core-tidy.workspace = true
oriel-media.workspace = true
oriel-runtime.workspace = true
oriel-tools.workspace = true
# Quick Look reads the window's AppKit view from GPUI's raw handle (0.6, as GPUI has it).
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Quick Look's panel, on the objc2 0.6 line GPUI's own macOS crates use.
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
oriel-ui = { workspace = true, features = ["test-support"] }
# The archive the UI tests scan, made at test time.
oriel-test-archive.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
