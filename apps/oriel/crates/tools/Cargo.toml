[package]
name = "oriel-tools"
description = "The pinned ffmpeg and ffprobe found at run time, a runner that kills on cancel, and what they read of a video."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ffprobe's numbers read as JavaScript's `Number()` and `Math.round` read them.
oriel-core-domain.workspace = true
oriel-core-paths.workspace = true
oriel-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `media_tools`'s rule for unfetched tools: skip locally, fail on CI.
oriel-test-archive.workspace = true

[lints]
workspace = true
