[package]
name = "oriel-ui"
description = "Oriel's house kit on GPUI Kit: the theme, the top bar, the sidebar parts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
log.workspace = true
serde_json.workspace = true

# Which key a press came from (`keys::digit_key`), which GPUI's keystroke does not say.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
