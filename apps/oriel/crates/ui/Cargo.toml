[package]
name = "oriel-ui"
description = "Oriel's house kit on GPUI Kit: the parts every mode's window is made of, and what the shell and the modes agree on."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui-kit.workspace = true
# The one-pixel stand-in the image cache keeps for a picture in the atlas, made of the `image`
# 0.25 frames GPUI's `RenderImage` holds.
image = { version = "0.25", default-features = false }
log.workspace = true
# How the activity panel writes counts.
oriel-core-domain.workspace = true
# The tokens jobs are stopped and paused with.
oriel-runtime.workspace = true
serde_json.workspace = true

# Which key a press came from (`keys::digit_key`), which GPUI's keystroke does not say.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }

[features]
# `test_window`, for the modes' headless tests.
test-support = ["gpui-kit/test-support"]

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
