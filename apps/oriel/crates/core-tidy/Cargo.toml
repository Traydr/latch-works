[package]
name = "oriel-core-tidy"
description = "Tidy's engine: the catalog, the scan, the analysis passes, duplicate sets and similar groups, and the plans, executor and holding that change the archive."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are modules of one binary, tests/main.rs, but quit.rs, which
# stops every tool in the process, has one of its own.
autotests = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
# Skip reasons and the planner's groups are listed in the order they were first met.
indexmap = "2"
log.workspace = true
oriel-core-domain.workspace = true
oriel-core-format.workspace = true
oriel-core-paths.workspace = true
# Convert's stills to AVIF, through the vendored libavif.
oriel-avif.workspace = true
oriel-runtime.workspace = true
oriel-tools.workspace = true
oriel-vips.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The machine's memory, which bounds how many stills encode at once (`hw.memsize`).
libc = "0.2"
# Emptying holding moves its batches to the Trash through NSFileManager.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

# Emptying holding moves its batches to the Recycle Bin through the shell's `IFileOperation`, at
# the versions already in the lock (GPUI's Windows backend builds `windows` with these features).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"

[dev-dependencies]
# The archive the engine's tests scan, made at test time.
oriel-test-archive.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "quit"
path = "tests/quit.rs"

[lints]
workspace = true
