[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# GPUI Kit pins its GPUI snapshot exactly, so this pin is exact too. Bump it on its own, with the
# GPUI tests and plan 063's Phase 0 measurements re-run.
gpui-kit = "=0.8.1"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The collation data ships inside this crate (icu_collator_data), so a bump can change the order
# of names. Bump it on its own, with the media-domain conformance vectors re-run.
icu_collator = "=2.4.0"
# NFC for path identities. Pinned with icu_collator, which already depends on it, so both carry
# the same Unicode data.
icu_normalizer = "=2.4.0"
futures = "0.3"
# SQLite is built from source and linked in, so every catalog gets the same SQLite whatever the
# system has.
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", default-features = false }
# Members name the TLS and body features they need; the runtime's tests need none.
reqwest = { version = "0.13", default-features = false }
sha2 = "0.11"

oriel-core-paths = { path = "crates/core-paths" }
oriel-launch = { path = "crates/launch" }
oriel-core-domain = { path = "crates/core-domain" }
oriel-core-format = { path = "crates/core-format" }
oriel-avif = { path = "crates/avif" }
oriel-core-sync = { path = "crates/core-sync" }
oriel-core-tidy = { path = "crates/core-tidy" }
oriel-ui = { path = "crates/ui" }
oriel-media = { path = "crates/media" }
oriel-mode-view = { path = "crates/mode-view" }
oriel-mode-tidy = { path = "crates/mode-tidy" }
oriel-mode-sync = { path = "crates/mode-sync" }
oriel-runtime = { path = "crates/runtime" }
oriel-tools = { path = "crates/tools" }
oriel-vips = { path = "crates/vips" }
oriel-test-archive = { path = "crates/test-archive" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The app the owner double-clicks: `cargo run -p xtask -- bundle` builds it with this profile.
# Fat LTO over one codegen unit makes the binary 30 % smaller (45.6 to 31.8 MB; 26 MB in the
# bundle, which leaves out the symbol table), with the same cold start and sorts. It also makes
# a build take about three minutes after any change, against seconds, so `cargo build
# --release`, which the spikes and examples use, stays as Cargo has it. Not
# `panic = "abort"`: the runtime turns a job's or a catalog call's panic into its error.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Debug builds, the tests' too, optimise every dependency a little: GPUI's layout and drawing, the
# image crate and SQLite unoptimised took Tidy's UI tests 138 s rather than 87, and a UI test
# draws hundreds of frames. A clean build takes 73 s rather than 45, once; an edit to Oriel's own
# code rebuilds none of them. Level 2 ran the tests no faster.
[profile.dev.package."*"]
opt-level = 1

# Tidy's engine and its libvips binding as well: the tests run their pixel work on every still
# they scan, which took a damaged-AVIF case 15 s unoptimised and takes 2.5. An edit here rebuilds
# a second slower.
[profile.dev.package.oriel-core-tidy]
opt-level = 1

[profile.dev.package.oriel-vips]
opt-level = 1
