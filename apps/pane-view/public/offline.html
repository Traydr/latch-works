<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Pane View is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #18181b;
        --popover: #ffffff;
        --muted-foreground: #66666e;
        --primary: #7c3aed;
        --primary-hover: #8b5cf6;
        --float: 0 0 0 1px rgb(0 0 0 / 0.06), 0 16px 40px -18px rgb(0 0 0 / 0.35);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --foreground: #f4f4f5;
          --popover: #18181b;
          --muted-foreground: #a1a1aa;
          --primary: #8b5cf6;
          --primary-hover: #a78bfa;
          --float: 0 0 0 1px rgb(255 255 255 / 0.08), 0 18px 44px -18px rgb(0 0 0 / 0.8);
        }
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
        box-sizing: border-box;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: grid;
        width: 100%;
        max-width: 24rem;
        gap: 12px;
        justify-items: center;
        padding: 24px;
        box-sizing: border-box;
        border-radius: 12px;
        background: var(--popover);
        box-shadow: var(--float);
        text-align: center;
      }

      img {
        width: 48px;
        height: 48px;
        border-radius: 10px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        text-wrap: balance;
      }

      p {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 14px;
        line-height: 1.45;
        text-wrap: pretty;
      }

      button {
        min-height: 44px;
        margin-top: 4px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      @media (hover: hover) {
        button:hover {
          background: var(--primary-hover);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="/favicon.svg" />
      <h1>You're offline</h1>
      <p>Pane View needs a connection to show your archive. Nothing is stored on this device.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
