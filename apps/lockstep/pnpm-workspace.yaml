packages:
  - "."
  - "../../packages/lockstep-core"
  - "../../packages/media-index"
  - "../../packages/media-domain"
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
blockExoticSubdeps: true
minimumReleaseAge: 10080
nodeLinker: hoisted
overrides:
  fs-xattr: "0.3.1"
  macos-alias: "0.2.12"
  yauzl: "3.3.1"
trustPolicy: no-downgrade
# Electron Forge transitively pins these mature dev-only releases without current trust evidence.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
