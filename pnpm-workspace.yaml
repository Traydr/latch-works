packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
blockExoticSubdeps: false
# Explicit pnpm default. Electron Forge's system check refuses pnpm unless
# node-linker is hoisted or a hoist pattern is declared; the default private
# hoist keeps the isolated layout while satisfying that check.
hoistPattern:
  - "*"
minimumReleaseAge: 10080
# CVE-2026-102989 (GHSA-qx66-fv34-fjm8): exact TanStack Start patch releases, exempt until
# they clear the 7-day window on 2026-10-07. Remove this list after that date.
minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/react-start@1.168.60"
  - "@tanstack/react-start-client@1.168.39"
  - "@tanstack/react-start-rsc@0.1.59"
  - "@tanstack/react-start-server@1.167.46"
  - "@tanstack/react-store@0.11.2"
  - "@tanstack/router-core@1.171.34"
  - "@tanstack/router-generator@1.167.40"
  - "@tanstack/router-plugin@1.168.42"
  - "@tanstack/start-client-core@1.170.34"
  - "@tanstack/start-plugin-core@1.171.49"
  - "@tanstack/start-server-core@1.169.39"
  - "@tanstack/start-storage-context@1.167.36"
  - "@tanstack/store@0.11.2"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
# Electron Forge transitively pins these mature dev-only releases without current trust evidence.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
overrides:
  '@electron/node-gyp': 10.2.0-electron.2
  fs-xattr: "0.3.1"
  macos-alias: "0.2.12"
  yauzl: "3.3.1"
allowBuilds:
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-x64': true
  '@ffprobe-installer/win32-ia32': true
  '@ffprobe-installer/win32-x64': true
  '@napi-rs/canvas': true
  '@napi-rs/canvas-linux-x64-gnu': true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  fs-xattr: true
  macos-alias: true
  sharp: true
